server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stoma}
    username: ${SPRING_DATASOURCE_USERNAME:stoma}
    password: ${SPRING_DATASOURCE_PASSWORD:stoma}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-change-me-change-me-change-me}
    expirationMinutes: ${APP_JWT_EXP_MIN:240}
  sign:
    baseUrl: ${APP_BASE_URL:http://localhost:8080}
    cleanupHours: 6
    api-key: ${SIGN_API_KEY:}
    token-ttl-minutes: ${SIGN_TOKEN_TTL_MIN:15}
    public-base-url: ${SIGN_PUBLIC_BASE_URL:}
    storage:
      baseDir: ./data/tmp
      incoming-dir: ${SIGN_INCOMING_DIR:./data/tmp/incoming}
      signed-dir: ${SIGN_SIGNED_DIR:./data/tmp/signed}
  auth:
    users:
      - username: diana
        password: ${PAROLA_ADMIN}
        
      - username: asistenta
        password: ${PAROLA_ASISTENTA}

efactura:
  enabled: true
  environment: test   # test | prod
  client-id: ${ANAF_CLIENT_ID}
  client-secret: ${ANAF_CLIENT_SECRET}
  redirect-uri:
    swing: http://localhost:8765/oauth/callback
    backend: https://cabinet-backend-production-31b3.up.railway.app/api/efactura/oauth/callback
  oauth:
    authorize-url: https://logincert.anaf.ro/anaf-oauth2/v1/authorize
    token-url: https://logincert.anaf.ro/anaf-oauth2/v1/token
  api:
    base-test: https://api.anaf.ro/test
    base-prod: https://api.anaf.ro/test
    list-days: 60
    upload-path: /FCTEL/rest/upload?standard=UBL&cif={cif}
    status-path: /FCTEL/rest/stareMesaj?id_incarcare={index}
    list-path: /FCTEL/rest/listaMesajeFactura
    download-path: /FCTEL/rest/descarcare?id={id}
